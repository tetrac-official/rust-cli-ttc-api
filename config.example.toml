# Skill Trading CLI Configuration
#
# This is the default configuration file for skill-trading CLI.
# Edit this file to customize your trading preferences.
#
# Location: ~/.config/skill-trading/config.toml (Linux/macOS)
#           %APPDATA%\skill-trading\config.toml (Windows)

# ============================================================================
# API Settings
# ============================================================================
[api]
# TTC Box API base URL
base_url = "https://ttc.box/api/v1"

# Request timeout in seconds
timeout = 30

# Number of retry attempts for failed requests
max_retries = 3

# Delay between retries in milliseconds
retry_delay_ms = 500

# ============================================================================
# Output Settings
# ============================================================================
[output]
# Default output format: table, json, csv, quiet
format = "table"

# Enable colored output
color = true

# ============================================================================
# Trading Settings
# ============================================================================
[trading]
# Default order size
default_size = 0.001

# Default leverage for new positions
default_leverage = 10

# Require confirmation before placing orders
confirm_orders = true

# Dry run mode - don't execute, just show what would happen
dry_run = false

# Min Order in USD
min_usd_entry = 15.0  # Minimum USD notional per TWAP slice


[portfolio]
max_margin_utilization = 80.0  # Warn if locked margin / total balance > this %
min_liq_distance_pct = 10.0   # Warn if any position's liquidation is < this % away
max_position_notional = 5000.0 # Warn if any single position notional > this USD

[watchlist]
symbols = ["NEARUSDT", "BTCUSDT", "ETHUSDT"]

[market-maker]
limit_order_commission = 0.00 # TTC Orderly integration has zero fees on limit orders. Adjust correctly for other exchanges
min_spread = 0.001 # 10 bps 0.1% percentage
